version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates arrive together; major updates arrive one per pull request
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # FSharp.Core sets the minimum FSharp.Core version for consumers of the packages, so it is updated deliberately
      - dependency-name: FSharp.Core
      # SkiaSharp is kept on the 2.x line referenced by TorchSharp
      - dependency-name: SkiaSharp*
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
