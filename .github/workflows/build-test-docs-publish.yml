name: Build, test, generate docs, publish

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
    tags:        
      - v*             # Push events to v1.2.3 tag
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Install tool dependencies
      run: dotnet tool restore
    # Release build is used to prepare packages
    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore --verbosity normal
    # Debug build is used to prepare docs
    - name: Build (Debug)
      run: dotnet build --configuration Debug --no-restore --verbosity normal
    - name: Test
      run: dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover --configuration Release --no-build --verbosity normal
    - name: Get git commit info
      run: |
        printf '%s\n' \
          "GIT_COMMIT_AUTHOR=$(git log -1 --pretty=%cn)" \
          "GIT_COMMIT_AUTHOR_EMAIL=$(git log -1 --pretty=%ce)" \
          "GIT_COMMIT_MESSAGE=$(git log -1 --pretty=%s)" \
          >> "$GITHUB_ENV"
    - name: Run coveralls
      if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
      run: >
        dotnet csmacnz.Coveralls
        --opencover -i tests/Dfx.Tests/coverage.opencover.xml
        --useRelativePaths
        --repoToken "$COVERALLS_REPO_TOKEN"
        --commitId ${{ github.sha }}
        --commitBranch ${{ github.ref }}
        --commitAuthor "${{ env.GIT_COMMIT_AUTHOR }}"
        --commitEmail ${{ env.GIT_COMMIT_AUTHOR_EMAIL }}
        --commitMessage "${{ env.GIT_COMMIT_MESSAGE }}"
        --jobId ${{ github.run_number }}
    # 16 Apr 2021: disabling codecov due to bash uploader security concern
    # - name: Codecov
      # uses: codecov/codecov-action@v1
    - name: Run fsdocs
      run: dotnet fsdocs build --eval --strict --properties Configuration=Release
    - name: Upload GitHub Pages artifact
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./output

  deploy_docs:

    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy documentation to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  pack_cpu:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Pack
      run: dotnet pack --configuration Release --verbosity normal
    - name: Obtain NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: dsyme
    - name: Publish NuGets
      run: dotnet nuget push "bin/packages/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

  # Done in a separate job because it downloads the massive Windows CUDA packages (though only for reference
  # during the package build, it doesn't actually use them)
  pack_cuda_windows:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Pack (Dfx-cuda-windows)
      run: dotnet pack --configuration Release --verbosity normal bundles/Dfx-cuda-windows
    - name: Obtain NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: dsyme
    - name: Publish NuGets
      run: dotnet nuget push "bin/packages/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

  # Done in a separate job because it downloads the massive Linux CUDA packages (though only for reference
  # during the package build, it doesn't actually use them)
  pack_cuda_linux:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Disable global.json
      run: mv ./global.json ./global.bak || true
    - name: Install dependencies
      run: dotnet restore
    - name: Pack (Dfx-cuda-linux)
      run: dotnet pack --configuration Release --verbosity normal bundles/Dfx-cuda-linux
    - name: Obtain NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: dsyme
    - name: Publish NuGets
      run: dotnet nuget push "bin/packages/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

  # Done in a separate job because it downloads the massive Linux CUDA packages (though only for reference
  # during the package build, it doesn't actually use them)
  pack_cuda:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Disable global.json
      run: mv ./global.json ./global.bak || true
    - name: Install dependencies
      run: dotnet restore
    - name: Pack (Dfx-cuda)
      run: dotnet pack --configuration Release --verbosity normal bundles/Dfx-cuda
    - name: Obtain NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: dsyme
    - name: Publish NuGets
      run: dotnet nuget push "bin/packages/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

# Trusted publishing uses NuGet OIDC.
# See: https://learn.microsoft.com/nuget/nuget-org/publish-a-package#trusted-publishing
