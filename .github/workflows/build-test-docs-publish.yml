name: Build, test, generate docs, publish

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
    tags:        
      - v*             # Push events to v1.2.3 tag
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_release:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-solution-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-solution-
    - name: Install dependencies
      run: dotnet restore
    - name: Install tool dependencies
      run: dotnet tool restore
    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore --verbosity normal
    - name: Test
      run: dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover --configuration Release --no-build --verbosity normal --logger "console;verbosity=detailed"
    - name: Get git commit info
      run: |
        printf '%s\n' \
          "GIT_COMMIT_AUTHOR=$(git log -1 --pretty=%cn)" \
          "GIT_COMMIT_AUTHOR_EMAIL=$(git log -1 --pretty=%ce)" \
          "GIT_COMMIT_MESSAGE=$(git log -1 --pretty=%s)" \
          >> "$GITHUB_ENV"
    - name: Run coveralls
      if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
      run: >
        dotnet csmacnz.Coveralls
        --opencover -i tests/Dfx.Tests/coverage.opencover.xml
        --useRelativePaths
        --repoToken "$COVERALLS_REPO_TOKEN"
        --commitId ${{ github.sha }}
        --commitBranch ${{ github.ref }}
        --commitAuthor "${{ env.GIT_COMMIT_AUTHOR }}"
        --commitEmail ${{ env.GIT_COMMIT_AUTHOR_EMAIL }}
        --commitMessage "${{ env.GIT_COMMIT_MESSAGE }}"
        --jobId ${{ github.run_number }}

  build_docs:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-solution-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-solution-
    - name: Install dependencies
      run: dotnet restore
    - name: Install tool dependencies
      run: dotnet tool restore
    - name: Build (Debug)
      run: dotnet build --configuration Debug --no-restore --verbosity normal
    - name: Run fsdocs
      run: dotnet fsdocs build --clean --eval --strict --properties Configuration=Debug
    - name: Upload GitHub Pages artifact
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./output

  deploy_docs:

    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build_docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy documentation to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  pack_core:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test_release

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-core-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-core-
    - name: Install dependencies
      run: dotnet restore
    - name: Pack core packages
      run: |
        dotnet pack src/Dfx.Core/Dfx.Core.fsproj --configuration Release --no-restore --verbosity normal
        dotnet pack src/Dfx.Data/Dfx.Data.fsproj --configuration Release --no-restore --verbosity normal
        dotnet pack src/Dfx.Backends.Reference/Dfx.Backends.Reference.fsproj --configuration Release --no-restore --verbosity normal
        dotnet pack src/Dfx.Backends.Torch/Dfx.Backends.Torch.fsproj --configuration Release --no-restore --verbosity normal
    - name: Obtain NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: dsyme
    - name: Publish core packages
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        for id in dfx-Dfx.Core dfx-Dfx.Data dfx-Dfx.Backends.Reference dfx-Dfx.Backends.Torch; do
          packages=(bin/packages/"$id".[0-9]*.nupkg)
          if [[ ${#packages[@]} -ne 1 || ! -f ${packages[0]} ]]; then
            echo "::error::Expected exactly one package for $id, found ${#packages[@]}"
            exit 1
          fi
          dotnet nuget push "${packages[0]}" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        done
    - name: Verify core packages on NuGet
      run: |
        set -euo pipefail
        version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)
        for id in dfx-Dfx.Core dfx-Dfx.Data dfx-Dfx.Backends.Reference dfx-Dfx.Backends.Torch; do
          normalized_id=${id,,}
          url="https://api.nuget.org/v3-flatcontainer/$normalized_id/$version/$normalized_id.$version.nupkg"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 10 --output /dev/null "$url"
        done

  pack_cpu:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pack_core

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-cpu-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-cpu-
    - name: Install dependencies
      run: dotnet restore
    - name: Pack CPU bundles
      run: |
        dotnet pack bundles/dfx-lite/Dfx-lite.fsproj --configuration Release --no-restore --verbosity normal
        dotnet pack bundles/dfx-cpu/Dfx-cpu.fsproj --configuration Release --no-restore --verbosity normal
    - name: Obtain NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: dsyme
    - name: Publish CPU bundles
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        for id in dfx-lite dfx-cpu; do
          packages=(bin/packages/"$id".[0-9]*.nupkg)
          if [[ ${#packages[@]} -ne 1 || ! -f ${packages[0]} ]]; then
            echo "::error::Expected exactly one package for $id, found ${#packages[@]}"
            exit 1
          fi
          dotnet nuget push "${packages[0]}" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        done
  # Done in a separate job because it downloads the massive Windows CUDA packages (though only for reference
  # during the package build, it doesn't actually use them)
  pack_cuda_windows:

    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: pack_core

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-cuda-windows-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-cuda-windows-
    - name: Install dependencies
      run: dotnet restore bundles/dfx-cuda-windows/Dfx-cuda-windows.fsproj
    - name: Pack (dfx-cuda-windows)
      run: dotnet pack --configuration Release --no-restore --verbosity normal bundles/dfx-cuda-windows
    - name: Obtain NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: dsyme
    - name: Publish dfx-cuda-windows
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        packages=(bin/packages/dfx-cuda-windows.[0-9]*.nupkg)
        if [[ ${#packages[@]} -ne 1 || ! -f ${packages[0]} ]]; then
          echo "::error::Expected exactly one dfx-cuda-windows package, found ${#packages[@]}"
          exit 1
        fi
        dotnet nuget push "${packages[0]}" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  # Done in a separate job because it downloads the massive Linux CUDA packages (though only for reference
  # during the package build, it doesn't actually use them)
  pack_cuda_linux:

    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: pack_core

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-cuda-linux-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-cuda-linux-
    - name: Install dependencies
      run: dotnet restore bundles/dfx-cuda-linux/Dfx-cuda-linux.fsproj
    - name: Pack (dfx-cuda-linux)
      run: dotnet pack --configuration Release --no-restore --verbosity normal bundles/dfx-cuda-linux
    - name: Obtain NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: dsyme
    - name: Publish dfx-cuda-linux
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        packages=(bin/packages/dfx-cuda-linux.[0-9]*.nupkg)
        if [[ ${#packages[@]} -ne 1 || ! -f ${packages[0]} ]]; then
          echo "::error::Expected exactly one dfx-cuda-linux package, found ${#packages[@]}"
          exit 1
        fi
        dotnet nuget push "${packages[0]}" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  # Done in a separate job because it downloads the massive Linux CUDA packages (though only for reference
  # during the package build, it doesn't actually use them)
  pack_cuda:

    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: pack_core

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-cuda-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-cuda-
    - name: Install dependencies
      run: dotnet restore bundles/dfx-cuda/Dfx-cuda.fsproj
    - name: Pack (dfx-cuda)
      run: dotnet pack --configuration Release --no-restore --verbosity normal bundles/dfx-cuda
    - name: Obtain NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: dsyme
    - name: Publish dfx-cuda
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        packages=(bin/packages/dfx-cuda.[0-9]*.nupkg)
        if [[ ${#packages[@]} -ne 1 || ! -f ${packages[0]} ]]; then
          echo "::error::Expected exactly one dfx-cuda package, found ${#packages[@]}"
          exit 1
        fi
        dotnet nuget push "${packages[0]}" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

# Trusted publishing uses NuGet OIDC.
# See: https://learn.microsoft.com/nuget/nuget-org/publish-a-package#trusted-publishing
